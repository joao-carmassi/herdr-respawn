[package]
name = "herdr-respawn"
version = "0.1.2"
edition = "2021"
description = "herdr plugin: saves long-running pane processes and re-runs them when herdr restarts"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
strip = true
codegen-units = 1
